name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ./Coverage.sln

      - name: Build
        run: dotnet build ./Coverage.sln --no-restore -c Release

      - name: Test
        run: dotnet test ./Coverage.sln --no-build -c Release --verbosity normal
